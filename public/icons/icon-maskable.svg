
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="160" y1="120" x2="360" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="180" y1="160" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="phoneGlow" x1="200" y1="100" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="100" y="80" width="312" height="352" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#2563eb" opacity="0.18" filter="url(#glow)" />

  <!-- Phone Outline Outer (Safe Zone is within 100 to 412) -->
  <rect x="176" y="116" width="160" height="280" rx="36" fill="#1e293b" stroke="#3b82f6" stroke-width="6" />
  
  <!-- Screen Area -->
  <rect x="188" y="136" width="136" height="240" rx="24" fill="#090d16" />
  
  <!-- Notch/Speaker -->
  <rect x="236" y="126" width="40" height="4" rx="2" fill="#475569" />

  <!-- Stylized ShopFlow "SF" & Flow Waves inside phone -->
  <!-- Cart / Cash Flow Symbol -->
  <path d="M226 210L256 180L286 210" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M256 180V270" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Flow Ring / Wave Base -->
  <circle cx="256" cy="305" r="22" stroke="url(#primaryGrad)" stroke-width="6" fill="#1e293b" />
  <circle cx="256" cy="305" r="9" fill="#38bdf8" />
  
  <!-- Bottom Home Indicator -->
  <rect x="234" y="364" width="44" height="4" rx="2" fill="#64748b" />
</svg>
